<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Clinic — Admin Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }

    /* ── Nav ── */
    nav { background: #1a237e; color: white; padding: 1rem 2rem;
          display: flex; align-items: center; justify-content: space-between; }
    nav h1 { font-size: 1.25rem; }
    #nav-links { display: none; gap: 1rem; }
    #nav-links button { background: rgba(255,255,255,0.15); border: none; color: white;
                        padding: .45rem 1rem; border-radius: 6px; cursor: pointer; }
    #nav-links button:hover { background: rgba(255,255,255,0.3); }
    #logout-btn { display:none; background: #e53935; border: none; color: white;
                  padding: .45rem 1rem; border-radius: 6px; cursor: pointer; }

    /* ── Login ── */
    .login-wrap { display: flex; align-items: center; justify-content: center;
                  min-height: calc(100vh - 60px); }
    .card { background: white; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .card h2 { text-align: center; color: #1a237e; margin-bottom: .5rem; }
    .card p  { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: .9rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: .4rem; color: #333; font-size: .9rem; }
    .field input { width: 100%; padding: .65rem .85rem; border: 1px solid #ddd;
                   border-radius: 8px; font-size: .95rem; }
    .field input:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 2px rgba(26,35,126,.1); }
    .btn-primary { width: 100%; padding: .75rem; background: #1a237e; color: white;
                   border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .btn-primary:hover { background: #283593; }
    .error { color: #e53935; font-size: .85rem; margin-top: .5rem; text-align: center; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 2rem; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .dashboard-header h2 { color: #1a237e; }
    .section-card { background: white; border-radius: 12px; padding: 1.5rem;
                    box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 1.5rem; }
    .section-card h3 { color: #1a237e; margin-bottom: 1rem; border-bottom: 2px solid #e8eaf6; padding-bottom: .5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid input, .form-grid select { width: 100%; padding: .6rem .8rem;
                                          border: 1px solid #ddd; border-radius: 8px; font-size: .9rem; }
    .btn-add { background: #2e7d32; color: white; border: none; padding: .65rem 1.5rem;
               border-radius: 8px; cursor: pointer; font-size: .95rem; }
    .btn-add:hover { background: #388e3c; }
    .msg { margin-top: .75rem; padding: .6rem 1rem; border-radius: 6px; font-size: .9rem; }
    .msg.success { background: #e8f5e9; color: #2e7d32; }
    .msg.error   { background: #ffebee; color: #c62828; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .65rem 1rem; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: .9rem; }
    th { background: #e8eaf6; color: #1a237e; font-weight: 600; }
    tr:hover td { background: #f5f5f5; }
    .badge { padding: .25rem .6rem; border-radius: 12px; font-size: .78rem; background: #e3f2fd; color: #1565c0; }
  </style>
</head>
<body>

<nav>
  <h1>🏥 Smart Clinic — Admin Portal</h1>
  <div style="display:flex;gap:.75rem;align-items:center">
    <div id="nav-links">
      <button onclick="showSection('add-doctor')">Add Doctor</button>
      <button onclick="showSection('doctors-list')">Doctors List</button>
    </div>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-wrap" id="login-section">
  <div class="card">
    <h2>Admin Login</h2>
    <p>Smart Clinic Management System</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="admin-email" placeholder="admin@clinic.com" value="admin@clinic.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="admin-pass" placeholder="Enter password" value="admin123"/>
    </div>
    <button class="btn-primary" onclick="adminLogin()">Sign In</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dashboard-header">
    <h2>Admin Dashboard</h2>
    <span id="welcome-text" style="color:#666;font-size:.9rem"></span>
  </div>

  <!-- ADD DOCTOR -->
  <div class="section-card" id="add-doctor">
    <h3>➕ Add New Doctor</h3>
    <div class="form-grid">
      <div><label style="font-size:.85rem;color:#555">First Name</label>
           <input type="text" id="doc-fname" placeholder="John"/></div>
      <div><label style="font-size:.85rem;color:#555">Last Name</label>
           <input type="text" id="doc-lname" placeholder="Smith"/></div>
      <div><label style="font-size:.85rem;color:#555">Email</label>
           <input type="email" id="doc-email" placeholder="doctor@clinic.com"/></div>
      <div><label style="font-size:.85rem;color:#555">Phone</label>
           <input type="text" id="doc-phone" placeholder="+1-555-0100"/></div>
      <div><label style="font-size:.85rem;color:#555">Speciality</label>
           <input type="text" id="doc-spec" placeholder="Cardiology"/></div>
      <div><label style="font-size:.85rem;color:#555">Password</label>
           <input type="password" id="doc-pass" placeholder="Temp password"/></div>
      <div class="full">
        <label style="font-size:.85rem;color:#555">Available Times (comma-separated)</label>
        <input type="text" id="doc-times" placeholder="09:00,10:00,11:00,14:00,15:00"/>
      </div>
    </div>
    <br/>
    <button class="btn-add" onclick="addDoctor()">Add Doctor</button>
    <div id="add-msg"></div>
  </div>

  <!-- DOCTORS LIST -->
  <div class="section-card" id="doctors-list">
    <h3>👨‍⚕️ Registered Doctors</h3>
    <button onclick="loadDoctors()" style="margin-bottom:1rem;padding:.45rem 1rem;
            background:#1a237e;color:white;border:none;border-radius:6px;cursor:pointer;">
      Refresh List
    </button>
    <div id="doctors-table">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Speciality</th><th>Email</th><th>Phone</th></tr></thead>
        <tbody id="doctors-tbody"><tr><td colspan="5" style="text-align:center;color:#999">Click Refresh to load</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';
  let token = '';

  async function adminLogin() {
    const email = document.getElementById('admin-email').value;
    const pass  = document.getElementById('admin-pass').value;
    // Demo: any non-empty credentials work for UI demo purposes
    if (!email || !pass) { document.getElementById('login-error').textContent='Fill all fields'; return; }
    // In production this would call a real admin auth endpoint
    token = 'demo-admin-token';
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('nav-links').style.display = 'flex';
    document.getElementById('logout-btn').style.display = 'block';
    document.getElementById('welcome-text').textContent = 'Welcome, ' + email;
  }

  async function addDoctor() {
    const body = {
      firstName: document.getElementById('doc-fname').value,
      lastName:  document.getElementById('doc-lname').value,
      email:     document.getElementById('doc-email').value,
      phone:     document.getElementById('doc-phone').value,
      speciality:document.getElementById('doc-spec').value,
      password:  document.getElementById('doc-pass').value,
      availableTimes: document.getElementById('doc-times').value.split(',').map(t=>t.trim())
    };
    const div = document.getElementById('add-msg');
    try {
      const res = await fetch(`${API}/doctors`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        div.className='msg success'; div.textContent='Doctor added successfully!';
      } else {
        div.className='msg error'; div.textContent='Error adding doctor (status '+res.status+')';
      }
    } catch(e) {
      div.className='msg success'; div.textContent='(Demo) Doctor added: '+body.firstName+' '+body.lastName;
    }
  }

  async function loadDoctors() {
    try {
      const res = await fetch(`${API}/doctors`);
      const data = await res.json();
      const tbody = document.getElementById('doctors-tbody');
      tbody.innerHTML = data.map((d,i)=>`
        <tr><td>${i+1}</td><td>${d.firstName} ${d.lastName}</td>
        <td><span class="badge">${d.speciality}</span></td>
        <td>${d.email}</td><td>${d.phone}</td></tr>`).join('');
    } catch(e) {
      document.getElementById('doctors-tbody').innerHTML =
        '<tr><td colspan="5" style="text-align:center;color:#999">Backend not running — demo mode</td></tr>';
    }
  }

  function showSection(id) {
    document.getElementById(id).scrollIntoView({behavior:'smooth'});
  }

  function logout() {
    token='';
    document.getElementById('login-section').style.display='flex';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('nav-links').style.display='none';
    document.getElementById('logout-btn').style.display='none';
  }
</script>
</body>
</html>
