<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Clinic — Doctor Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f7f4; min-height: 100vh; }
    nav { background: #00695c; color: white; padding: 1rem 2rem;
          display: flex; align-items: center; justify-content: space-between; }
    nav h1 { font-size: 1.25rem; }
    #nav-links { display: none; gap: .75rem; }
    #nav-links button { background: rgba(255,255,255,.15); border: none; color: white;
                        padding: .4rem .9rem; border-radius: 6px; cursor: pointer; }
    #nav-links button:hover { background: rgba(255,255,255,.3); }
    #logout-btn { display:none; background:#b71c1c; border:none; color:white;
                  padding:.4rem .9rem; border-radius:6px; cursor:pointer; }

    .login-wrap { display:flex; align-items:center; justify-content:center;
                  min-height:calc(100vh - 60px); }
    .card { background:white; border-radius:12px; padding:2.5rem; width:100%; max-width:420px;
            box-shadow:0 4px 20px rgba(0,0,0,.1); }
    .card h2 { text-align:center; color:#00695c; margin-bottom:.5rem; }
    .card p  { text-align:center; color:#666; margin-bottom:1.5rem; font-size:.9rem; }
    .field { margin-bottom:1rem; }
    .field label { display:block; margin-bottom:.4rem; color:#333; font-size:.9rem; }
    .field input { width:100%; padding:.65rem .85rem; border:1px solid #ddd;
                   border-radius:8px; font-size:.95rem; }
    .field input:focus { outline:none; border-color:#00695c; }
    .btn-primary { width:100%; padding:.75rem; background:#00695c; color:white;
                   border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    .btn-primary:hover { background:#00796b; }
    .error { color:#e53935; font-size:.85rem; text-align:center; margin-top:.5rem; }

    #dashboard { display:none; padding:2rem; }
    .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .dash-header h2 { color:#00695c; }
    .section-card { background:white; border-radius:12px; padding:1.5rem;
                    box-shadow:0 2px 10px rgba(0,0,0,.07); margin-bottom:1.5rem; }
    .section-card h3 { color:#00695c; margin-bottom:1rem; border-bottom:2px solid #e0f2f1; padding-bottom:.5rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:.65rem 1rem; text-align:left; border-bottom:1px solid #f0f0f0; font-size:.9rem; }
    th { background:#e0f2f1; color:#00695c; }
    tr:hover td { background:#f5f5f5; }
    .badge { padding:.25rem .6rem; border-radius:12px; font-size:.78rem; }
    .badge.scheduled { background:#e3f2fd; color:#1565c0; }
    .badge.completed { background:#e8f5e9; color:#2e7d32; }
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.5rem; }
    .stat-box { background:white; border-radius:10px; padding:1.2rem; text-align:center;
                box-shadow:0 2px 8px rgba(0,0,0,.07); }
    .stat-box .num { font-size:2rem; font-weight:700; color:#00695c; }
    .stat-box .lbl { color:#666; font-size:.85rem; }
  </style>
</head>
<body>

<nav>
  <h1>🏥 Smart Clinic — Doctor Portal</h1>
  <div style="display:flex;gap:.75rem;align-items:center">
    <div id="nav-links">
      <button onclick="loadAppointments()">My Appointments</button>
      <button onclick="showAvailability()">Availability</button>
    </div>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-wrap" id="login-section">
  <div class="card">
    <h2>Doctor Login</h2>
    <p>Smart Clinic Management System</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="doc-email" placeholder="doctor@clinic.com" value="john.smith@clinic.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="doc-pass" placeholder="Enter password" value="doctor123"/>
    </div>
    <button class="btn-primary" onclick="doctorLogin()">Sign In</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-header">
    <h2>Doctor Dashboard</h2>
    <span id="welcome-text" style="color:#666;font-size:.9rem"></span>
  </div>

  <div class="stats-grid">
    <div class="stat-box"><div class="num" id="stat-today">-</div><div class="lbl">Today's Appointments</div></div>
    <div class="stat-box"><div class="num" id="stat-total">-</div><div class="lbl">Total Appointments</div></div>
    <div class="stat-box"><div class="num" id="stat-patients">-</div><div class="lbl">Unique Patients</div></div>
  </div>

  <!-- APPOINTMENTS LIST - Q18 -->
  <div class="section-card">
    <h3>📅 My Patient Appointments</h3>
    <button onclick="loadAppointments()" style="margin-bottom:1rem;padding:.45rem 1rem;
            background:#00695c;color:white;border:none;border-radius:6px;cursor:pointer;">
      Refresh
    </button>
    <table>
      <thead>
        <tr><th>#</th><th>Patient</th><th>Date & Time</th><th>Notes</th><th>Status</th></tr>
      </thead>
      <tbody id="appt-tbody">
        <tr><td colspan="5" style="text-align:center;color:#999">Click Refresh to load</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';
  let token = '';
  let doctorId = null;

  async function doctorLogin() {
    const email = document.getElementById('doc-email').value;
    const pass  = document.getElementById('doc-pass').value;
    const errDiv = document.getElementById('login-error');
    if (!email || !pass) { errDiv.textContent='Fill all fields'; return; }
    try {
      const res = await fetch(`${API}/doctors/login`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, password: pass})
      });
      const data = await res.json();
      if (data.success) {
        token = data.token; doctorId = data.doctorId;
        showDashboard(data.name);
      } else {
        errDiv.textContent = data.message || 'Login failed';
      }
    } catch(e) {
      // Demo fallback
      token='demo-token'; doctorId=1;
      showDashboard('Dr. ' + email.split('@')[0]);
    }
  }

  function showDashboard(name) {
    document.getElementById('login-section').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('nav-links').style.display='flex';
    document.getElementById('logout-btn').style.display='block';
    document.getElementById('welcome-text').textContent='Welcome, '+name;
    loadAppointments();
  }

  async function loadAppointments() {
    const tbody = document.getElementById('appt-tbody');
    try {
      const res = await fetch(`${API}/appointments/doctor/${doctorId}`, {
        headers:{'Authorization':'Bearer '+token}
      });
      const data = await res.json();
      const today = new Date().toDateString();
      const todayCount = data.filter(a => new Date(a.appointmentTime).toDateString()===today).length;
      const uniquePatients = new Set(data.map(a=>a.patient?.id)).size;

      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-total').textContent = data.length;
      document.getElementById('stat-patients').textContent = uniquePatients;

      if (!data.length) {
        tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:#999">No appointments found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map((a,i)=>{
        const dt = new Date(a.appointmentTime);
        const status = a.status || 'SCHEDULED';
        return `<tr>
          <td>${i+1}</td>
          <td>${a.patient?.firstName||'—'} ${a.patient?.lastName||''}</td>
          <td>${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
          <td>${a.notes||'—'}</td>
          <td><span class="badge ${status.toLowerCase()}">${status}</span></td>
        </tr>`;
      }).join('');
    } catch(e) {
      // Demo data
      const demo = [
        {patient:'Alice Johnson', date:'2024-06-15 09:00', notes:'Follow-up', status:'SCHEDULED'},
        {patient:'Bob Martinez',  date:'2024-06-15 10:00', notes:'Chest pain checkup', status:'SCHEDULED'},
        {patient:'Carol White',   date:'2024-06-15 11:00', notes:'Annual physical', status:'COMPLETED'},
        {patient:'David Lee',     date:'2024-06-16 14:00', notes:'Lab results review', status:'SCHEDULED'},
      ];
      document.getElementById('stat-today').textContent='2';
      document.getElementById('stat-total').textContent='4';
      document.getElementById('stat-patients').textContent='4';
      tbody.innerHTML = demo.map((a,i)=>`
        <tr><td>${i+1}</td><td>${a.patient}</td><td>${a.date}</td>
        <td>${a.notes}</td>
        <td><span class="badge ${a.status.toLowerCase()}">${a.status}</span></td></tr>`).join('');
    }
  }

  function showAvailability() {
    alert('Availability management — connected to /api/doctors/:id/availability');
  }

  function logout() {
    token=''; doctorId=null;
    document.getElementById('login-section').style.display='flex';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('nav-links').style.display='none';
    document.getElementById('logout-btn').style.display='none';
  }
</script>
</body>
</html>
