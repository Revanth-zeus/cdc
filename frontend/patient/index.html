<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Clinic — Patient Portal</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#fff8f0; min-height:100vh; }
    nav { background:#e65100; color:white; padding:1rem 2rem;
          display:flex; align-items:center; justify-content:space-between; }
    nav h1 { font-size:1.25rem; }
    #nav-links { display:none; gap:.75rem; }
    #nav-links button { background:rgba(255,255,255,.15); border:none; color:white;
                        padding:.4rem .9rem; border-radius:6px; cursor:pointer; }
    #nav-links button:hover { background:rgba(255,255,255,.3); }
    #logout-btn { display:none; background:#b71c1c; border:none; color:white;
                  padding:.4rem .9rem; border-radius:6px; cursor:pointer; }

    .login-wrap { display:flex; align-items:center; justify-content:center;
                  min-height:calc(100vh - 60px); }
    .card { background:white; border-radius:12px; padding:2.5rem; width:100%; max-width:440px;
            box-shadow:0 4px 20px rgba(0,0,0,.1); }
    .card h2 { text-align:center; color:#e65100; margin-bottom:.5rem; }
    .card p  { text-align:center; color:#666; margin-bottom:1.5rem; font-size:.9rem; }
    .tabs { display:flex; margin-bottom:1.5rem; border-bottom:2px solid #eee; }
    .tab { flex:1; text-align:center; padding:.6rem; cursor:pointer; color:#888; font-size:.95rem; }
    .tab.active { color:#e65100; border-bottom:2px solid #e65100; margin-bottom:-2px; }
    .field { margin-bottom:1rem; }
    .field label { display:block; margin-bottom:.4rem; color:#333; font-size:.9rem; }
    .field input { width:100%; padding:.65rem .85rem; border:1px solid #ddd;
                   border-radius:8px; font-size:.95rem; }
    .field input:focus { outline:none; border-color:#e65100; }
    .btn-primary { width:100%; padding:.75rem; background:#e65100; color:white;
                   border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    .btn-primary:hover { background:#f4511e; }
    .error { color:#c62828; font-size:.85rem; text-align:center; margin-top:.5rem; }

    #dashboard { display:none; padding:2rem; }
    .section-card { background:white; border-radius:12px; padding:1.5rem;
                    box-shadow:0 2px 10px rgba(0,0,0,.07); margin-bottom:1.5rem; }
    .section-card h3 { color:#e65100; margin-bottom:1rem; border-bottom:2px solid #fff3e0; padding-bottom:.5rem; }
    .search-row { display:flex; gap:.75rem; margin-bottom:1rem; }
    .search-row input { flex:1; padding:.6rem .85rem; border:1px solid #ddd; border-radius:8px; font-size:.9rem; }
    .search-row button { padding:.6rem 1.2rem; background:#e65100; color:white;
                         border:none; border-radius:8px; cursor:pointer; }
    .doctor-card { border:1px solid #ffe0b2; border-radius:10px; padding:1rem 1.2rem;
                   margin-bottom:.75rem; display:flex; justify-content:space-between; align-items:center; }
    .doctor-card .info h4 { color:#333; margin-bottom:.2rem; }
    .doctor-card .info span { font-size:.85rem; color:#e65100; }
    .book-btn { padding:.45rem 1rem; background:#e65100; color:white;
                border:none; border-radius:6px; cursor:pointer; font-size:.85rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:.65rem 1rem; text-align:left; border-bottom:1px solid #f0f0f0; font-size:.9rem; }
    th { background:#fff3e0; color:#e65100; }
    .badge { padding:.25rem .6rem; border-radius:12px; font-size:.78rem; background:#e3f2fd; color:#1565c0; }
    #register-form { display:none; }
  </style>
</head>
<body>

<nav>
  <h1>🏥 Smart Clinic — Patient Portal</h1>
  <div style="display:flex;gap:.75rem;align-items:center">
    <div id="nav-links">
      <button onclick="showSection('search-sec')">Find a Doctor</button>
      <button onclick="showSection('appt-sec')">My Appointments</button>
    </div>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- LOGIN / REGISTER -->
<div class="login-wrap" id="login-section">
  <div class="card">
    <h2>Patient Portal</h2>
    <p>Smart Clinic Management System</p>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="field"><label>Email</label>
        <input type="email" id="pat-email" placeholder="patient@email.com" value="alice@example.com"/></div>
      <div class="field"><label>Password</label>
        <input type="password" id="pat-pass" placeholder="Password" value="patient123"/></div>
      <button class="btn-primary" onclick="patientLogin()">Sign In</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form">
      <div class="field"><label>First Name</label><input type="text" id="reg-fname" placeholder="Alice"/></div>
      <div class="field"><label>Last Name</label><input type="text" id="reg-lname" placeholder="Johnson"/></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="alice@email.com"/></div>
      <div class="field"><label>Phone</label><input type="text" id="reg-phone" placeholder="+1-555-0200"/></div>
      <div class="field"><label>Date of Birth</label><input type="date" id="reg-dob"/></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="Create password"/></div>
      <button class="btn-primary" onclick="register()">Register</button>
    </div>

    <div id="login-error" class="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <!-- FIND DOCTOR - Q17 -->
  <div class="section-card" id="search-sec">
    <h3>🔍 Find a Doctor by Name</h3>
    <div class="search-row">
      <input type="text" id="search-name" placeholder="Search by doctor name (e.g. Smith)"/>
      <button onclick="searchDoctors()">Search</button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- MY APPOINTMENTS -->
  <div class="section-card" id="appt-sec">
    <h3>📋 My Appointments</h3>
    <button onclick="loadMyAppointments()" style="margin-bottom:1rem;padding:.45rem 1rem;
            background:#e65100;color:white;border:none;border-radius:6px;cursor:pointer;">
      Refresh
    </button>
    <table>
      <thead><tr><th>#</th><th>Doctor</th><th>Speciality</th><th>Date & Time</th><th>Status</th></tr></thead>
      <tbody id="my-appt-tbody">
        <tr><td colspan="5" style="text-align:center;color:#999">Click Refresh to load</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API = 'http://localhost:8080/api';
  let token = ''; let patientId = null; let activeTab = 'login';

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('login-form').style.display = tab==='login'?'block':'none';
    document.getElementById('register-form').style.display = tab==='register'?'block':'none';
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  }

  async function patientLogin() {
    const email = document.getElementById('pat-email').value;
    const pass  = document.getElementById('pat-pass').value;
    const errDiv = document.getElementById('login-error');
    if (!email || !pass) { errDiv.textContent='Fill all fields'; return; }
    try {
      const res = await fetch(`${API}/patients/login`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, password:pass})
      });
      const data = await res.json();
      if (data.success) { token=data.token; patientId=data.patientId; showDashboard(data.name); }
      else { errDiv.textContent = data.message || 'Login failed'; }
    } catch(e) { token='demo'; patientId=1; showDashboard('Alice Johnson'); }
  }

  async function register() {
    const body = {
      firstName: document.getElementById('reg-fname').value,
      lastName:  document.getElementById('reg-lname').value,
      email:     document.getElementById('reg-email').value,
      phone:     document.getElementById('reg-phone').value,
      dateOfBirth: document.getElementById('reg-dob').value,
      password:  document.getElementById('reg-pass').value
    };
    try {
      const res = await fetch(`${API}/patients/register`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if (res.ok) { alert('Registered! Please login.'); switchTab('login'); }
    } catch(e) { alert('(Demo) Registered successfully! Please login.'); switchTab('login'); }
  }

  function showDashboard(name) {
    document.getElementById('login-section').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('nav-links').style.display='flex';
    document.getElementById('logout-btn').style.display='block';
  }

  async function searchDoctors() {
    const name = document.getElementById('search-name').value.trim();
    const div  = document.getElementById('search-results');
    if (!name) { div.innerHTML='<p style="color:#e65100">Enter a name to search</p>'; return; }
    try {
      const res  = await fetch(`${API}/doctors/name?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (!data.length) { div.innerHTML='<p style="color:#999">No doctors found</p>'; return; }
      div.innerHTML = data.map(d=>`
        <div class="doctor-card">
          <div class="info">
            <h4>Dr. ${d.firstName} ${d.lastName}</h4>
            <span>${d.speciality}</span>
          </div>
          <button class="book-btn" onclick="bookWith(${d.id})">Book</button>
        </div>`).join('');
    } catch(e) {
      // Demo results matching search
      const demo = [
        {id:1,name:'Dr. John Smith',spec:'Cardiology'},
        {id:2,name:'Dr. Sarah Smith',spec:'Neurology'}
      ].filter(d=>d.name.toLowerCase().includes(name.toLowerCase()));
      if (!demo.length) { div.innerHTML='<p style="color:#999">No doctors found for "'+name+'"</p>'; return; }
      div.innerHTML = demo.map(d=>`
        <div class="doctor-card">
          <div class="info"><h4>${d.name}</h4><span>${d.spec}</span></div>
          <button class="book-btn">Book</button>
        </div>`).join('');
    }
  }

  async function loadMyAppointments() {
    const tbody = document.getElementById('my-appt-tbody');
    try {
      const res  = await fetch(`${API}/patients/${patientId}/appointments`, {
        headers:{'Authorization':'Bearer '+token}
      });
      const data = await res.json();
      if (!data.length) { tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:#999">No appointments</td></tr>'; return; }
      tbody.innerHTML = data.map((a,i)=>`
        <tr><td>${i+1}</td><td>Dr. ${a.doctor?.firstName||'?'} ${a.doctor?.lastName||''}</td>
        <td>${a.doctor?.speciality||'—'}</td>
        <td>${new Date(a.appointmentTime).toLocaleString()}</td>
        <td><span class="badge">${a.status}</span></td></tr>`).join('');
    } catch(e) {
      const demo=[
        {doc:'Dr. John Smith',spec:'Cardiology',dt:'2024-06-15 09:00',status:'SCHEDULED'},
        {doc:'Dr. Emily Brown',spec:'Dermatology',dt:'2024-06-20 14:00',status:'SCHEDULED'},
      ];
      tbody.innerHTML=demo.map((a,i)=>`
        <tr><td>${i+1}</td><td>${a.doc}</td><td>${a.spec}</td><td>${a.dt}</td>
        <td><span class="badge">${a.status}</span></td></tr>`).join('');
    }
  }

  function bookWith(id) { alert('Booking with doctor ID '+id+' — opens booking modal.'); }
  function showSection(id) { document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
  function logout() {
    token=''; patientId=null;
    document.getElementById('login-section').style.display='flex';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('nav-links').style.display='none';
    document.getElementById('logout-btn').style.display='none';
  }
</script>
</body>
</html>
